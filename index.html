<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>পি টু পি সিসি ক্যামেরা</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; background: #121212; color: white; margin: 0; padding: 15px; text-align: center; }
        .container { max-width: 500px; margin: auto; background: #1e1e1e; padding: 20px; border-radius: 12px; }
        .box { margin-bottom: 15px; padding: 15px; border: 1px solid #333; border-radius: 8px; background: #2a2a2a; }
        input, button { padding: 12px; font-size: 16px; margin: 5px; border-radius: 6px; border: none; width: 90%; }
        input { background: #333; color: white; border: 1px solid #555; text-align: center; }
        button { background: #007bff; color: white; font-weight: bold; cursor: pointer; }
        .btn-cam { background: #28a745; }
        .btn-view { background: #17a2b8; }
        .btn-stop { background: #dc3545; }
        
        #video-container { 
            width: 100%; 
            height: 350px; 
            background: black; 
            border-radius: 8px; 
            overflow: hidden; 
            margin: 10px 0;
        }
        video { width: 100%; height: 100%; object-fit: cover; }
        .hidden { display: none; }
        .badge { background: #e0a800; color: black; padding: 5px 10px; border-radius: 4px; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <h2>📱 পি টু পি সিসি ক্যামেরা</h2>

    <div id="setup-section" class="box">
        <p>আপনার ফোন কোড: <span id="my-peer-id" style="font-weight: bold; color: #4CAF50;">...</span></p>
        
        <hr style="border-color: #444;">
        
        <!-- ক্যামেরা মোড -->
        <h3>১. সিসি ক্যামেরা ফোন হলে:</h3>
        <button class="btn-cam" onclick="startCamera()">📷 ক্যামেরা চালু করুন</button>
        
        <hr style="border-color: #444;">

        <!-- ভিউয়ার মোড -->
        <h3>২. ভিউয়ার (মনিটর) ফোন হলে:</h3>
        <input type="text" id="target-id" placeholder="ক্যামেরা ফোনের ৪ সংখ্যার কোড দিন" maxlength="4">
        <button class="btn-view" onclick="startViewing()">👁️ লাইভ মনিটর দেখুন</button>
    </div>

    <!-- ভিডিও স্ক্রিন -->
    <div id="view-section" class="box hidden">
        <span id="status-badge" class="badge">ক্যামেরা প্রস্তুত হচ্ছে...</span>
        <div id="video-container">
            <video id="videoElement" autoplay playsinline muted></video>
        </div>
        <button class="btn-stop" onclick="location.reload()">বন্ধ করুন</button>
    </div>
</div>

<script>
    let peer;
    let myId;
    let localStream;

    function generateRandomCode() {
        return Math.floor(1000 + Math.random() * 9000).toString();
    }

    function initPeer() {
        let savedId = localStorage.getItem('cctv_peer_id');
        myId = savedId ? savedId : generateRandomCode();
        localStorage.setItem('cctv_peer_id', myId);

        document.getElementById('my-peer-id').innerText = myId;
        peer = new Peer(myId);
    }

    // ১. ক্যামেরা চালু করা (সিসি ক্যামেরা ফোনের জন্য)
    function startCamera() {
        navigator.mediaDevices.getUserMedia({ 
            video: { facingMode: "environment" }, 
            audio: true 
        })
        .then((stream) => {
            localStream = stream;
            document.getElementById('videoElement').srcObject = stream;
            
            showVideoScreen("🔴 সিসি ক্যামেরা লাইভ ব্রডকাস্ট চলছে");

            // ভিউয়ার কল করলে স্ট্রিম পাঠানো হবে
            peer.on('call', (call) => {
                call.answer(localStream);
            });
        })
        .catch((err) => {
            // পেছনের ক্যামেরা কাজ না করলে ফ্রন্ট বা ডিফল্ট ক্যামেরা চালু করবে
            navigator.mediaDevices.getUserMedia({ video: true, audio: true })
            .then((stream) => {
                localStream = stream;
                document.getElementById('videoElement').srcObject = stream;
                showVideoScreen("🔴 সিসি ক্যামেরা লাইভ (ডিফল্ট)");
                peer.on('call', (call) => call.answer(localStream));
            })
            .catch(() => alert("ক্যামেরা চালুর অনুমতি (Permission) দেওয়া হয়নি!"));
        });
    }

    // ২. সিসি ক্যামেরা মনিটর করা (ভিউয়ার ফোনের জন্য)
    function startViewing() {
        let targetId = document.getElementById('target-id').value;
        if (!targetId || targetId.length !== 4) {
            alert("সঠিক ৪ সংখ্যার কোড দিন!");
            return;
        }

        // অডিও/ভিডিও ট্র্যাকসহ ফেক কানেকশন কল পাঠাবে
        navigator.mediaDevices.getUserMedia({ video: true, audio: false })
        .then((myDummyStream) => {
            let call = peer.call(targetId, myDummyStream);
            
            call.on('stream', (remoteStream) => {
                let videoWin = document.getElementById('videoElement');
                videoWin.srcObject = remoteStream;
                videoWin.play();
                showVideoScreen("🟢 লাইভ সিসি ক্যামেরা যুক্ত হয়েছে");
            });
        })
        .catch(() => {
            alert("ভিউয়ার ফোনে ক্যামেরা এক্সেস না দিলে কানেক্ট করা সম্ভব হচ্ছে না। অনুমতি দিন।");
        });
    }

    function showVideoScreen(msg) {
        document.getElementById('setup-section').classList.add('hidden');
        document.getElementById('view-section').classList.remove('hidden');
        document.getElementById('status-badge').innerText = msg;
    }

    window.onload = initPeer;
</script>

</body>
</html>
