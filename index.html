<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>P2P স্মার্ট সিসি ক্যামেরা</title>
    <!-- PeerJS লাইব্রেরি -->
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        body { font-family: 'SolaimanLipi', Arial, sans-serif; background: #111; color: white; text-align: center; margin: 0; padding: 15px; }
        .box { background: #222; padding: 20px; border-radius: 12px; max-width: 450px; margin: auto; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        input, button { padding: 12px; font-size: 16px; margin: 8px 0; width: 90%; border-radius: 6px; border: none; }
        input { background: #333; color: white; border: 1px solid #555; text-align: center; }
        button { background: #28a745; color: white; font-weight: bold; cursor: pointer; }
        button:hover { background: #218838; }
        
        #video-box { 
            width: 100%; 
            height: 350px; 
            background: black; 
            margin-top: 15px; 
            border-radius: 8px; 
            overflow: hidden; 
            position: relative;
        }
        video { width: 100%; height: 100%; object-fit: cover; }
        .hidden { display: none; }
        .badge { background: #007bff; color: white; padding: 5px 10px; border-radius: 4px; font-size: 13px; display: inline-block; margin-bottom: 10px; }
    </style>
</head>
<body>

<div class="box">
    <h2>📱 পি টু পি সিসি ক্যামেরা</h2>
    <span id="status-badge" class="badge">ক্যামেরা তৈরি হচ্ছে...</span>
    
    <p style="margin: 5px 0;">আপনার ডিভাইসের কোড: <br><b id="my-id" style="color: #00ff08; font-size: 22px;">...</b></p>

    <!-- মনিটর সেকশন -->
    <div id="controls">
        <hr style="border-color: #444; margin: 15px 0;">
        <input type="text" id="target" placeholder="ক্যামেরা ফোনের ৪ সংখ্যার কোড দিন" maxlength="4">
        <button onclick="watch()">👁️ সিসি ক্যামেরা মনিটর করুন</button>
    </div>

    <!-- ভিডিও ডিসপ্লে স্ক্রিন -->
    <div id="video-box">
        <video id="video" autoplay playsinline muted></video>
    </div>
</div>

<script>
    let peer;
    let localStream;

    function generateID() {
        return Math.floor(1000 + Math.random() * 9000).toString();
    }

    function initCCTV() {
        let savedId = localStorage.getItem('cctv_p2p_id');
        let myId = savedId ? savedId : generateID();
        localStorage.setItem('cctv_p2p_id', myId);
        
        document.getElementById('my-id').innerText = myId;

        // গুগল স্টান সার্ভার ব্যবহার করে ব্রাউজার ব্লক বাইপাস করার কনফিগারেশন
        peer = new Peer(myId, {
            config: {
                'iceServers': [
                    { 'urls': 'stun:stun.l.google.com:19302' },
                    { 'urls': 'stun:stun1.l.google.com:19302' },
                    { 'urls': 'stun:stun2.l.google.com:19302' }
                ]
            }
        });

        peer.on('open', id => {
            console.log("CCTV Node Ready with ID: " + id);
            document.getElementById('status-badge').innerText = "অটো-ক্যামেরা ব্যাকগ্রাউন্ডে রেডি";
            document.getElementById('status-badge').style.background = "#28a745";
            
            // অটোমেটিক সিসি ক্যামেরা ফোনটিতে ক্যামেরা ব্যাকগ্রাউন্ডে স্ট্রিম চালু রাখা
            navigator.mediaDevices.getUserMedia({ 
                video: { facingMode: "environment" }, 
                audio: true 
            })
            .then(stream => {
                localStream = stream;
                // ব্যাকগ্রাউন্ডে ক্যামেরা অন থাকলে স্থানীয় স্ক্রিনে দেখাবে
                document.getElementById('video').srcObject = stream;
            })
            .catch(() => {
                // পেছনের ক্যামেরা ব্লক হলে ডিফল্ট ক্যামেরা ট্রাই করবে
                navigator.mediaDevices.getUserMedia({ video: true, audio: true })
                .then(stream => {
                    localStream = stream;
                    document.getElementById('video').srcObject = stream;
                })
                .catch(err => {
                    document.getElementById('status-badge').innerText = "ক্যামেরা পারমিশন ব্লকেড!";
                    document.getElementById('status-badge').style.background = "#dc3545";
                });
            });
        });

        // অন্য ফোন থেকে দেখা শুরু করতে চাইলে সাথে সাথে সিসি ক্যামেরা স্ট্রিম রেসপন্স করবে
        peer.on('call', call => {
            if (localStream) {
                call.answer(localStream);
            } else {
                navigator.mediaDevices.getUserMedia({ video: true, audio: true }).then(stream => {
                    localStream = stream;
                    call.answer(stream);
                });
            }
        });
    }

    // ভিউয়ার ফোনের ফাংশনাল কোড
    function watch() {
        let targetId = document.getElementById('target').value.trim();
        if(!targetId || targetId.length !== 4) return alert("দয়া করে সঠিক ৪ সংখ্যার কোড দিন!");
        
        document.getElementById('status-badge').innerText = "কানেক্ট করা হচ্ছে...";
        document.getElementById('status-badge').style.background = "#ffc107";
        document.getElementById('status-badge').style.color = "#000";

        // ব্যাকগ্রাউন্ড ট্রাফিকের জন্য ডামি কল
        let dummyStream = new MediaStream();
        let call = peer.call(targetId, dummyStream);
        
        call.on('stream', remoteStream => {
            let v = document.getElementById('video');
            v.srcObject = remoteStream;
            v.muted = false; // ভিউয়ার ফোনে অডিও শুনতেও সাহায্য করবে
            v.play();

            document.getElementById('status-badge').innerText = "🔴 লাইভ সিসি ক্যামেরা যুক্ত হয়েছে";
            document.getElementById('status-badge').style.background = "#dc3545";
            document.getElementById('status-badge').style.color = "#fff";
        });

        call.on('error', err => {
            alert("কানেক্ট করতে সমস্যা হয়েছে। কোড ঠিক আছে কিনা দেখুন।");
        });
    }

    window.onload = initCCTV;
</script>

</body>
</html>
